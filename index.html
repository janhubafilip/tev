<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Klasifikace TEV</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f0f2f5; }
        /* Trik pro schování lišty: Uděláme iframe o 50px vyšší a posuneme ho dolů */
        iframe { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; 
            height: calc(100% + 80px) !important;
            border: none; 
        }
    </style>
</head>
<body>
    <iframe src="https://script.google.com/macros/s/AKfycbwjGSZuBZ-qjeoKmpaifyqPBKxYxdmXjN6oeO63tlnjn0_lrXQ0dicby0kx75WTb2ra/exec"></iframe>
</body>
</html>

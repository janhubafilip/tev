<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Klasifikace TEV</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background-color: #f0f2f5; 
        }

        .container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Tohle ořízne vše, co vyteče ven */
        }

        iframe {
            position: absolute;
            /* TRIK: Posuneme iframe o 50px nahoru, aby zmizela horní lišta (pokud tam je) */
            top: -45px; 
            left: 0;
            width: 100%;
            /* TRIK: Uděláme ho vyšší, aby se spodní část vytáhla nahoru */
            height: calc(100% + 90px) !important; 
            border: none;
        }

        /* Na mobilu to necháme skoro v originálu, tam to fungovalo */
        @media (max-width: 600px) {
            iframe {
                top: 0;
                height: calc(100% + 40px) !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <iframe src="https://script.google.com/macros/s/AKfycbxShVONLOttNXAV9Zgja2DukcdRbXxEtgaSXJ--Qu2wLvwAryRI63okW5zJQXsKzro4/exec"></iframe>
    </div>
</body>
</html>
